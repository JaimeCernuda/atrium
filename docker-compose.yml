services:
  atrium:
    build: .
    container_name: atrium
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8070:8090"
    env_file:
      - .env
    environment:
      - ROOMS_FILE=/config/rooms.json
      - DATABASE_URL=postgresql://atrium:atrium@postgres:5432/atrium
    volumes:
      - ./config:/config:ro
      - atrium-avatars:/data/avatars

  postgres:
    image: postgres:16-alpine
    container_name: atrium-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=atrium
      - POSTGRES_PASSWORD=atrium
      - POSTGRES_DB=atrium
    volumes:
      - atrium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atrium-pgdata:
  atrium-avatars:
