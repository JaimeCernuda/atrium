services:
  atrium:
    build: .
    container_name: atrium
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ATRIUM_PORT:-8070}:8090"
    env_file:
      - .env
    environment:
      - ROOMS_FILE=/config/rooms.json
      - DATABASE_URL=postgresql://atrium:atrium@postgres:5432/atrium
    volumes:
      - ./config:/config:ro
      - atrium-avatars:/data/avatars

  postgres:
    image: postgres:16-alpine
    container_name: atrium-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=atrium
      - POSTGRES_PASSWORD=atrium
      - POSTGRES_DB=atrium
    volumes:
      - atrium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───── Optional self-hosted Jitsi (profile: jitsi) ─────
  # Enable with:
  #   docker compose --profile jitsi up -d
  # Prereqs:
  #   - scripts/init-jitsi.sh  (run once to generate passwords + cfg dirs)
  #   - router port-forward UDP 10000 → this host
  #   - DNS/tunnel: meet.<your-domain> → localhost:${JITSI_HTTP_PORT:-8075}
  # See INSTALL.md for the full walkthrough.

  jitsi-web:
    profiles: ["jitsi"]
    image: jitsi/web:stable
    restart: unless-stopped
    ports:
      - "${JITSI_HTTP_PORT:-8075}:80"
    volumes:
      - ./jitsi-cfg/web:/config:Z
      - ./jitsi-cfg/web/letsencrypt:/etc/letsencrypt:Z
      - ./jitsi-cfg/transcripts:/usr/share/jitsi-meet/transcripts:Z
    environment:
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - ENABLE_LETSENCRYPT=0
      - DISABLE_HTTPS=1
      - ENABLE_HTTP_REDIRECT=0
      - PUBLIC_URL=${JITSI_PUBLIC_URL}
      - TZ=${TZ:-UTC}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:
        aliases:
          - ${JITSI_XMPP_DOMAIN:-meet.jitsi}

  jitsi-prosody:
    profiles: ["jitsi"]
    image: jitsi/prosody:stable
    restart: unless-stopped
    expose:
      - "5222"
      - "5280"
      - "5347"
    volumes:
      - ./jitsi-cfg/prosody/config:/config:Z
      - ./jitsi-cfg/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH
      - ENABLE_GUESTS
      - GLOBAL_MODULES
      - GLOBAL_CONFIG
      - LDAP_URL
      - LDAP_BASE
      - LDAP_BINDDN
      - LDAP_BINDPW
      - LDAP_FILTER
      - LDAP_AUTH_METHOD
      - LDAP_VERSION
      - LDAP_USE_TLS
      - LDAP_TLS_CIPHERS
      - LDAP_TLS_CHECK_PEER
      - LDAP_TLS_CACERT_FILE
      - LDAP_TLS_CACERT_DIR
      - LDAP_START_TLS
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MODULES
      - XMPP_MUC_MODULES
      - XMPP_INTERNAL_MUC_MODULES
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_CROSS_DOMAIN=true
      - JICOFO_COMPONENT_SECRET
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD
      - JIGASI_XMPP_USER
      - JIGASI_XMPP_PASSWORD
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD
      - JWT_APP_ID
      - JWT_APP_SECRET
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - JWT_ASAP_KEYSERVER
      - JWT_ALLOW_EMPTY
      - JWT_AUTH_TYPE
      - JWT_TOKEN_AUTH_MODULE
      - LOG_LEVEL
      - PUBLIC_URL=${JITSI_PUBLIC_URL}
      - TURN_CREDENTIALS
      - TURN_HOST
      - TURNS_HOST
      - TURN_PORT
      - TURNS_PORT
      - TZ=${TZ:-UTC}
    networks:
      meet.jitsi:
        aliases:
          - ${JITSI_XMPP_SERVER:-xmpp.meet.jitsi}

  jitsi-jicofo:
    profiles: ["jitsi"]
    image: jitsi/jicofo:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JICOFO_REST_PORT:-8076}:8888"
    volumes:
      - ./jitsi-cfg/jicofo:/config:Z
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD
      - JICOFO_RESERVATION_REST_BASE_URL
      - JICOFO_ENABLE_AUTH
      - JICOFO_ENABLE_HEALTH_CHECKS
      - JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_PENDING_TIMEOUT
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD
      - JIGASI_BREWERY_MUC
      - JIGASI_SIP_URI
      - JVB_BREWERY_MUC=jvbbrewery
      - JICOFO_MAX_MEMORY=${JICOFO_MAX_MEMORY:-512m}
      - LOG_LEVEL
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
      - TZ=${TZ:-UTC}
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:

  jitsi-jvb:
    profiles: ["jitsi"]
    image: jitsi/jvb:stable
    restart: unless-stopped
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
    volumes:
      - ./jitsi-cfg/jvb:/config:Z
    environment:
      - DOCKER_HOST_ADDRESS=${JVB_ADVERTISE_IPS}
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS}
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=${JVB_PORT:-10000}
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_ENABLE_APIS=rest,colibri
      - VIDEOBRIDGE_MAX_MEMORY=${VIDEOBRIDGE_MAX_MEMORY:-768m}
      - COLIBRI_REST_ENABLED=true
      - LOG_LEVEL
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_RELEASE
      - TZ=${TZ:-UTC}
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:

networks:
  meet.jitsi:

volumes:
  atrium-pgdata:
  atrium-avatars:
